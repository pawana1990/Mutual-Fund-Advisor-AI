name: Backend CI

on:
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"

defaults:
  run:
    working-directory: apps/api

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wealth_advisor
          POSTGRES_PASSWORD: wealth_advisor
          POSTGRES_DB: wealth_advisor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wealth_advisor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://wealth_advisor:wealth_advisor@localhost:5432/wealth_advisor_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret
      ENVIRONMENT: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: pytest --cov=app --cov-report=xml --cov-fail-under=85
      - uses: codecov/codecov-action@v4
        with:
          files: apps/api/coverage.xml
          flags: backend
        continue-on-error: true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: bandit -r app -ll
      - run: pip-audit --strict || true # advisory; does not block merge on transitive-only findings

  build-image:
    needs: [lint-and-typecheck, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (no push — publishing happens in deploy.yml)
        run: docker build -t ai-wealth-advisor-api:ci .
